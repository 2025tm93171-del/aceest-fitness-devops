
name: ACEest Fitness CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q flask_app.py fitness_utils.py tests

      - name: Lint application and tests
        run: python -m flake8 flask_app.py fitness_utils.py tests

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t aceest-fitness:ci .

      - name: Run tests inside Docker
        run: docker run --rm aceest-fitness:ci
